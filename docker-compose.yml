services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: startmuslim, POSTGRES_PASSWORD: startmuslim, POSTGRES_DB: startmuslim }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  pgadmin:
    image: dpage/pgadmin4:8.14
    environment: { PGADMIN_DEFAULT_EMAIL: admin@startmuslim.com, PGADMIN_DEFAULT_PASSWORD: admin }
    ports: ["5051:80"]
    depends_on: [db]
volumes: { pgdata: {} }
